services:
  consul:
    image: hashicorp/consul:2.1.0
    container_name: service-discovery-consul
    command:
      - agent
      - -dev
      - -client=0.0.0.0
    ports:
      - '8500:8500'
    healthcheck:
      test: ['CMD', 'consul', 'members']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
